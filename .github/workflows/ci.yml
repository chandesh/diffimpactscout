name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: py-3.6
            python-version: "3.6"
            os: ubuntu-20.04
            pytest: "pytest<7"
          - name: py-3.8
            python-version: "3.8"
            os: ubuntu-latest
            pytest: "pytest"
          - name: py-3.12
            python-version: "3.12"
            os: ubuntu-latest
            pytest: "pytest"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install .
      - name: Install pytest
        run: pip install ${{ matrix.pytest }}
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests -q