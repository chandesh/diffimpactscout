[build-system]
requires = [
  'setuptools>=61 ; python_version >= "3.7"',
  'setuptools==59.6.0 ; python_version < "3.7"',
  'wheel',
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# Registry facade: intentional re-exports plus import-for-side-effect check
# registration (each check submodule registers itself via @register).
"src/diffimpactscout/checks/__init__.py" = ["F401"]